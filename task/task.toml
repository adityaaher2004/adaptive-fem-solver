schema_version = "1.4"

artifacts = ["/app/output/submission.json"] # paths the verifier reads from the agent; must be above the first [section]

[task]
name = "afterquery/adaptive-fem-solver" # must equal the task name you submit
description = "Implement an adaptive FEM solver for a custom mixed boundary L-shaped domain Poisson problem by submitting a P1 FEM mesh that has relative energy error at most 0.05, maximum 2,930 degrees of freedom and 14 solve budget run." # one sentence: what the task asks for
authors = [{ name = "Aditya Rahul Aher", email = "adityaaher2004@gmail.com" }] # mirrors author_name / author_email
keywords = ["finite-element-method", "pde"] # mirrors tags

[metadata]
author_name = "Aditya Rahul Aher"
author_email = "adityaaher2004@gmail.com"
author_organization = "Independent Researcher" # your university, institute, lab or employer, or exactly "Independent Researcher"
author_profile = "https://www.linkedin.com/in/aditya-aher/" # Google Scholar link (LinkedIn or a personal site also works)
research_advisor = "" # optional: your advisor/supervisor, if a PhD student or postdoc
referred_by = "" # optional: who referred you, if anyone
conflicts_of_interest = "None" # disclose any (employer, vendor engagement, competing benchmark work), or "None"
domain = "mathematical-sciences" # life-sciences | physical-sciences | earth-sciences | mathematical-sciences | engineering-sciences
field = "applied-mathematics" # one of the four fields in the domain (table below), e.g. "astronomy"
subfield = "finite element method" # free text: your specialization within the field, e.g. "radio interferometry"
category = "Science" # keep exactly this
subcategory = "Applied Mathematics & Scientific Computing" # the field's display name, e.g. "Astronomy"
tags = ["finite-element-method", "pde"] # specific, relevant keywords; at least one
expert_time_estimate_hours = 4 # best-case hours for a focused domain expert (must be > 0)
relevant_experience = "I have taken courses in numerical computing (graduate level numerical PDE methods, numerical analysis) and implemented numerical simulations, solvers such as quantum tunneling in potential barriers, finite difference/element schemes and more." # your professional background for THIS task; generic statements fail review
difficulty_explanation = "The problem is synthetic and has an exact closed-form solution. It is the Poisson problem on an L-shaped domain with Neumann data on one re-entrant edge and Dirichlet data elsewhere. Its exact solution is a corner singularity r^(1/3) sin(theta/3) plus a narrow Gaussian peak at (-0.43, 0.61). The Neumann edge strengthens the corner singularity to r^(1/3), so uniform refinement converges only as N^(-1/6). The interior peak defeats grading toward the corner alone, and it is so narrow (about 0.03) that low-order quadrature on coarse triangles misses it, so a naive estimator never refines there. At the 2930-DOF budget, the obvious shortcuts all fail by a wide margin. The agent needs non-trivial elements to succeed. While Poisson on the L shaped domain appears in standard adaptivity problem demonstration, this particular problem is novel and hard because it involves understanding the corner singularity , why uniform refinement fails to meet the budget, and a conforming adaptive refinement loop that keeps DOF ≤ 2930 while hitting 0.05 error. This requires real numerical PDE expertise. The implementation is substantive and not a canned library call or using external tools such as AFEM@matlab, iFEM, FEniCS/skfem adaptive demos. The approach to meeting the error tolerance and adhering to the budget needs to be reasoned out rather than putting in busywork and recalling already available libraries. The quintessence of the problem lies in truly understanding how mesh refinement works and the agent's ability to demonstrate just that. The agent must work on its own to develop a working valid mesh. In the real world a numerical analyst validating an adaptive solver performs this task." # why this task is hard for agents and humans; say whether the data is real or synthetic
solution_explanation = "Reference AFEM in solution/afem.py, built on the provided P1 package. Each iteration solves, then computes residual indicators: h_T^2 times the integral of f^2, interior gradient jumps, and the Neumann flux residual. Volume terms use composite quadrature with cells at most 0.04 across, so the peak is visible on the 6-triangle starting mesh. Dörfler marking with theta = 0.4 is followed by newest-vertex bisection with recursive conformity closure, starting from a compatible labelling in which every refinement edge is a square diagonal. It stops on the exact relative energy error. Result: 8 solves, 2868 DOF, relative error 0.0499 (about 280 s). The observed convergence rate is about N^(-0.54), against the optimal N^(-1/2)." # high-level approach and key insights
verification_explanation = "A sealed NumPy/SciPy verifier that never imports the agent's code or the provided fem package. It parses the JSON strictly, applies a size limit, and checks the mesh is a valid conforming triangulation of exactly the L-shaped domain: all triangles CCW with exact orientation tests, consistent shared edges, boundary edges covering each side exactly once, no hanging nodes, crossings or cut-out edges, and all six corners present. It recounts the DOF and checks the history length. It then re-assembles and solves the P1 system itself, and integrates the relative energy error against the closed-form exact solution, using a Duffy t^3 map on triangles touching the corner (removing the singularity) and subdivided Gauss rules for the peak. Within 1e-6 of the tolerance it recomputes at higher accuracy. The ground truth is the analytic manufactured solution. The verifier's ||grad u||^2 matches an independent Green's-identity computation to 1.4e-14, and its oracle error matches the provided package to 6e-17. Reward is fail-closed: 1 only if all 8 checks pass. The verifier applies the factor of 2 check on the reported to error to catch cheating attempts at reporting false passable values. " # how the tests verify correctness, and where the ground truth comes from

[verifier]
timeout_sec = 600.0 # increase based on test suite runtime (max 28800)
environment_mode = "separate" # verifier runs in its own container (required)

[verifier.environment]
network_mode = "no-network" # required; the verifier runs offline

[agent]
timeout_sec = 14400.0 # min 9000 (2.5h), max 28800; research workflows routinely need hours

[environment]
build_timeout_sec = 600.0
cpus = 1 # standard sizes only: 1 / 2 / 4 / 8 / 16
memory_mb = 2048 # standard sizes only: 1024 / 2048 / 4096 / 8192 / 16384
storage_mb = 10240 # max 40960
gpus = 0 # 0, or exactly 1 with the GPU option; any field may ask for one
# gpu_types = ["H100"] # required, exactly one class, when gpus = 1
network_mode = "public" # required; agents keep the open internet
# never set allow_internet; the deprecated key fails validation

